# Local preview only. docs.ficsit.app builds from its own playbook, which lists this
# repository with `start_path: docs`.
site:
  title: FicstFluids (local preview)
  start_page: ficstfluids::index.adoc

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs

ui:
  bundle:
    # The same UI bundle docs.ficsit.app uses, so the preview looks like the real site.
    url: https://gitlab.com/vilsol/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

output:
  dir: ./build/site
