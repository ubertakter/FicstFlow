# Builds the manual with Antora and publishes it to GitHub Pages.
# Runs on every push to main (that is, every merged pull request), and on demand from the
# Actions tab. Pull requests themselves only get a build check: the site is not published
# until the change is merged.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Publish manual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels a build that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Antora reads the repository through git; a shallow clone can confuse it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Antora prints warnings (a broken xref, a missing image) but still exits 0.
      # --log-failure-level=warn makes any warning fail the build, so a broken link
      # shows up as a red check on the pull request instead of a dead link on the site.
      - run: npx antora --log-failure-level=warn antora-playbook.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    # Pull requests are built and checked, never published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
